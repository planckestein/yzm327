[project]
name = "kurultay"
version = "2.0.0"
description = "Oylamalı kamusal forum — Cosmic Python mimarisiyle (YZM327, 1. ödev)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "mypy>=1.10"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient. is deprecated"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["kurultay.domain"]
strict = true
